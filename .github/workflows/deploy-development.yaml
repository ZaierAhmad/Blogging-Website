# .github/workflows/deploy-development.yaml
name: Deploy to GitHub Pages - Development

on:
  push:
    branches: [ develop ]

permissions:
  pages: write
  contents: read
  id-token: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18' # Or your preferred LTS version

      - name: Install dependencies
        run: npm install

      # Build the static site using Parcel
      - name: Build static site
        run: npm run build
        # Make sure your package.json build script is:
        # "build": "parcel build src/**/*.html styles/**/*.css --dist-dir public --public-url /Blogging-Website/ --no-cache"
        # Note: --public-url /Blogging-Website/ is correct if your site will be at username.github.io/Blogging-Website

      # --- FIX FOR NESTED OUTPUT STRUCTURE ---
      - name: Flatten build output directory
        run: |
          echo "Flattening build output structure..."
          # Check if the 'src' directory exists inside 'public'
          if [ -d "public/src" ]; then
            echo "Moving contents from public/src/ to public/"
            mv public/src/* public/
            echo "Removing empty public/src directory..."
            rmdir public/src # Remove the empty directory
            echo "Structure flattened successfully."
          else
            echo "public/src directory not found. Skipping directory flattening."
          fi
        # continue-on-error is set to true just in case, but ideally, this step should succeed.
        continue-on-error: true
      # --- END FIX ---

      # Upload the build output as an artifact for the deploy job
      - name: Upload artifact for GitHub Pages
        uses: actions/upload-pages-artifact@v3
        with:
          # This path MUST be './public/' (with trailing slash) to upload contents
          path: './public/'

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

      - name: Debug - Print Deployment URL
        run: echo "Your GitHub Pages URL is: ${{ steps.deployment.outputs.page_url }}"
